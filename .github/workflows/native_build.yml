name: Native Build

on:
  pull_request:
    branches: ["master", "release/*"]
  push:
    branches: ["master", "release/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: rialto-ocdm

      # Check, from which rialto branch should we download headers
      - name: Check if rialto branch with the same name exists
        id: check-branch
        working-directory: rialto-ocdm
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: sh scripts/select_rialto_ref.sh

      - name: Install Dependencies
        run: |
          WORK_DIR=$(pwd)

          echo "Using branch: ${{ steps.check-branch.outputs.branch }}"
          echo "Work dir: ${WORK_DIR}"

          cd rialto-ocdm
          set -o pipefail
          sudo sh -x install_dependencies_for_native_build.sh "${{ steps.check-branch.outputs.branch }}" "${WORK_DIR}" 2>&1 | tee "${WORK_DIR}/output_file.txt"

      - name: Native build OCDM
        run: |
          WORK_DIR=$(pwd)
          cd rialto-ocdm
          set -o pipefail
          sh -x build_native.sh "${WORK_DIR}" 2>&1 | tee -a "${WORK_DIR}/output_file.txt"

      - name: Report Build Status Success
        if: success()
        run: |
          echo "Build Succeeded!"
          exit 0

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Output Logs
          path: |
            output_file.txt
