name: Native Build

on:
  pull_request:
    branches: ["master", "release/*"]
  push:
    branches: ["master", "release/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: rialto-ocdm

      - name: Select compatible Rialto ref
        id: check-branch
        working-directory: rialto-ocdm
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: sh scripts/select_rialto_ref.sh

      - name: Check out rialto
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto
          ref: ${{ steps.check-branch.outputs.branch }}
          persist-credentials: false
          path: ./rialto

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential
          sudo apt-get install cmake
          sudo apt-get install libunwind-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libgstreamer1.0-dev libyaml-cpp-dev

      - name: Install protobuf
        run: |
          sudo apt-get install protobuf-compiler

      - name: Native build Rialto
        run: |
          BASE_DIR=$(pwd)
          NATIVE_DIR=$BASE_DIR/native
          echo "NATIVE_DIR=$NATIVE_DIR" &> $BASE_DIR/output_file.txt
          ls  &>> $BASE_DIR/output_file.txt
          cd rialto
          set -o pipefail
          cmake . -B build -DCMAKE_INSTALL_PREFIX="$NATIVE_DIR" -DNATIVE_BUILD=ON -DRIALTO_BUILD_TYPE="Debug" 2>&1 | tee -a "$BASE_DIR/output_file.txt"
          make -C build install 2>&1 | tee -a "$BASE_DIR/output_file.txt"

      - name: Native build OCDM
        run: |
          BASE_DIR=$(pwd)
          NATIVE_DIR=$BASE_DIR/native
          cd rialto-ocdm
          echo "@@@ OCDM BUILD"  &>> $BASE_DIR/output_file.txt
          set -o pipefail
          cmake . -B build -DCMAKE_INCLUDE_PATH="${NATIVE_DIR}/include" -DCMAKE_LIBRARY_PATH="${NATIVE_DIR}/lib" -DNATIVE_BUILD=ON -DRIALTO_BUILD_TYPE="Debug" 2>&1 | tee -a "$BASE_DIR/output_file.txt"
          make -C build 2>&1 | tee -a "$BASE_DIR/output_file.txt"

      - name: Report Build Status Success
        if: success()
        run: |
          echo "Build Succeeded!"
          exit 0

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Output Logs
          path: |
            output_file.txt
